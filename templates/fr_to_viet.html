<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>🌿 Tiếng Pháp → Tiếng Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to right, #fef9c3, #fefce8);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        .card h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #92400e;
        }

        .card h2 {
            font-size: 22px;
            color: #78350f;
            margin: 15px 0;
        }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #fcd34d;
            border-radius: 10px;
            outline: none;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        input[type="text"]:focus {
            border-color: #f59e0b;
        }

        .btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 8px 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #d97706;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 20px;
        }

        .back-home {
            display: inline-block;
            padding: 10px 20px;
            background-color: #fde68a;
            color: #78350f;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-home:hover {
            background-color: #fcd34d;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #feedback {
            font-size: 16px;
            font-weight: bold;
            margin: 8px;
        }

        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌿 Tiếng Pháp → Tiếng Việt</h1>
        <h2 id="french-word">Nhấn để bắt đầu</h2>
        <input type="text" id="answer" placeholder="Nhập nghĩa tiếng Việt của bạn">
        <div id="feedback"></div>
        <div>
            <button class="btn" onclick="checkAnswer()">🎯 Kiểm tra</button>
            <button class="btn" onclick="speakWord()">🔊 Phát âm</button>
        </div>
        <div class="footer">
            <a href="/" class="back-home">← Quay lại trang chủ</a>
        </div>
    </div>

    <script>
        let currentId = 0;
        let currentFrenchWord = "";
        let currentVietnameseMeaning = "";
        let voices = [];
        let voicesLoaded = false;

        // Lắng nghe sự kiện voiceschanged để tải giọng
        window.speechSynthesis.onvoiceschanged = () => {
            voices = speechSynthesis.getVoices();
            voicesLoaded = true; // Đánh dấu giọng đã được tải
        };

        
        function speakWord() {
    if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(currentFrenchWord);
        const voices = speechSynthesis.getVoices();
        const frenchVoice = voices.find(voice => voice.lang.startsWith('fr'));

        if (frenchVoice) {
            utterance.voice = frenchVoice;
        } else {
            alert("Không tìm thấy giọng tiếng Pháp. Hãy kiểm tra trình duyệt.");
        }

        utterance.lang = 'fr-FR';
        speechSynthesis.speak(utterance);
    } else {
        alert("Trình duyệt không hỗ trợ phát âm.");
    }
}

        // Kiểm tra câu trả lời
        function checkAnswer() {
            const userAnswer = document.getElementById("answer").value.trim().toLowerCase();
            const correctAnswer = currentVietnameseMeaning.toLowerCase();

            if (userAnswer === correctAnswer) {
                document.getElementById("feedback").innerHTML = "<span class='success'>✅ Chính xác!</span>";
                setTimeout(() => {
                    document.getElementById("answer").value = "";
                    document.getElementById("feedback").innerHTML = "";
                    nextWord();
                }, 800);
            } else {
                document.getElementById("feedback").innerHTML = "<span class='error'>❌ Chưa đúng, thử lại!</span>";
            }
        }

        // Tải từ tiếp theo
        function nextWord() {
            fetch(`/next-word-fr/${currentId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert("Hết từ để học!");
                        document.getElementById("french-word").innerText = "Hết từ";
                        document.getElementById("answer").disabled = true;
                        document.getElementById("answer").placeholder = "";
                        currentFrenchWord = "";
                        currentVietnameseMeaning = "";
                    } else {
                        currentId = data.id;
                        document.getElementById("french-word").innerText = data.french_word;
                        currentVietnameseMeaning = data.vietnamese_meaning;
                        document.getElementById("answer").value = "";
                        document.getElementById("answer").disabled = false;
                        document.getElementById("feedback").innerText = "";
                    }
                });
        }
// Gọi để tải giọng
speechSynthesis.onvoiceschanged = () => {
    speechSynthesis.getVoices();  // Nạp danh sách giọng
};

        // Khởi động
        nextWord();
    </script>
</body>
</html>
